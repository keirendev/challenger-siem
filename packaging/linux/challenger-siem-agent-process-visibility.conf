[Service]
# Optional, separately approved profile for cross-user /proc/<pid>/exe and
# socket-owner link visibility. The main agent remains non-root and receives no
# capability other than the kernel capability required by procfs ptrace access
# checks. Direct ptrace/process-memory/performance inspection syscalls remain
# unavailable to the service.
CapabilityBoundingSet=CAP_SYS_PTRACE
AmbientCapabilities=CAP_SYS_PTRACE
SystemCallFilter=~ptrace process_vm_readv process_vm_writev kcmp pidfd_getfd perf_event_open
